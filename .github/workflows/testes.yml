name: Conferência técnica local
on:
  push:
    branches: ["melhorias/**"]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r backend/requirements.txt -r frontend/requirements.txt -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest tests/test_api_workflow.py tests/test_security_contracts.py -q
        env:
          PYTHONPATH: backend
      - run: python -m unittest discover -s tests -p test_session_isolation.py -v
      - run: python tests/check_frontend_controls.py
        env:
          PYTHONPATH: frontend
